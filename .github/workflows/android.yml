name: Android app

# Builds the Google Play app (a Trusted Web Activity around transverse-bg.com,
# with Google Play Billing) from android/twa-manifest.json and uploads the
# signed .aab as a workflow artifact — upload it in Play Console.
#
# Secrets:
#   ANDROID_KEYSTORE_PASSWORD  your own strong password for the upload key (required)
#   ANDROID_KEYSTORE_BASE64    the upload key (base64). When missing, the first run
#                              creates one, protected by the password above, and
#                              offers it as a short-lived artifact to store here.
on:
  workflow_dispatch:
    inputs:
      version_name:
        description: 'Version shown in Google Play (e.g. 1.2.0)'
        required: true
        default: '1.2.0'
      version_code:
        description: 'Version code — a whole number, higher than the last upload'
        required: true
        default: '1'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Check the password
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [ ${#STORE_PASS} -lt 12 ]; then echo "::error::Add the secret ANDROID_KEYSTORE_PASSWORD (at least 12 characters) first."; exit 1; fi
      - name: Upload key
        id: key
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          mkdir -p "$RUNNER_TEMP/key"
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/key/android.keystore"
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            keytool -genkeypair -keystore "$RUNNER_TEMP/key/android.keystore" -storetype PKCS12 -alias transverse -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASS" -keypass "$STORE_PASS" -dname "CN=TransVerse, C=BG"
            base64 -w0 "$RUNNER_TEMP/key/android.keystore" > "$RUNNER_TEMP/key/ANDROID_KEYSTORE_BASE64.txt"
            echo "new=true" >> "$GITHUB_OUTPUT"
            echo "::warning::A new upload key was created. Download the artifact 'upload-key', put the text of ANDROID_KEYSTORE_BASE64.txt in the secret ANDROID_KEYSTORE_BASE64 and delete the artifact."
          fi
          echo "Upload key SHA-256 (for ANDROID_CERT_SHA256 when testing outside Play):"
          keytool -list -v -keystore "$RUNNER_TEMP/key/android.keystore" -storepass "$STORE_PASS" -alias transverse | grep 'SHA256:'
      - name: Keep the new upload key
        if: steps.key.outputs.new == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: upload-key
          path: ${{ runner.temp }}/key/ANDROID_KEYSTORE_BASE64.txt
          retention-days: 1
      - name: Generate the Android project
        env:
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          case "$VERSION_CODE" in ''|*[!0-9]*) echo "::error::version_code must be a whole number"; exit 1;; esac
          mkdir -p ~/.bubblewrap
          printf '{"jdkPath":"%s","androidSdkPath":"%s"}' "$JAVA_HOME" "$ANDROID_HOME" > ~/.bubblewrap/config.json
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;35.0.0" > /dev/null
          mkdir -p "$RUNNER_TEMP/twa"
          jq --arg n "$VERSION_NAME" --argjson c "$VERSION_CODE" '.appVersionName = $n | .appVersionCode = $c' android/twa-manifest.json > "$RUNNER_TEMP/twa/twa-manifest.json"
          cd "$RUNNER_TEMP/twa"
          npx --yes @bubblewrap/cli@1.27.0 update --skipVersionUpgrade --manifest=./twa-manifest.json < /dev/null
      - name: Build and sign
        env:
          STORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          VERSION_NAME: ${{ inputs.version_name }}
          VERSION_CODE: ${{ inputs.version_code }}
        run: |
          cd "$RUNNER_TEMP/twa"
          ./gradlew --no-daemon bundleRelease
          OUT="$GITHUB_WORKSPACE/transverse-$VERSION_NAME-$VERSION_CODE.aab"
          cp app/build/outputs/bundle/release/app-release.aab "$OUT"
          jarsigner -sigalg SHA256withRSA -digestalg SHA-256 -keystore "$RUNNER_TEMP/key/android.keystore" -storepass "$STORE_PASS" "$OUT" transverse
          jarsigner -verify "$OUT"
          rm -f "$RUNNER_TEMP/key/android.keystore"
      - uses: actions/upload-artifact@v4
        with:
          name: transverse-${{ inputs.version_name }}-${{ inputs.version_code }}
          path: transverse-*.aab
          retention-days: 30
