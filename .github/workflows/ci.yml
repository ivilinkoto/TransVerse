name: CI

on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/transverse
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/transverse_test
      ROUTING_PROVIDER: approximate
      REGISTER_LIMIT_PER_HOUR: '500'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Create databases
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'create database transverse'
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'create database transverse_test'
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
      - run: pnpm bundle
      - name: Prepare database for end-to-end tests
        run: |
          node dist/migrate.js
          node dist/import-geonames.js data/geo/launch-region.json
          node dist/seed.js 2
      - name: End-to-end tests
        run: |
          pnpm exec playwright install --with-deps chromium
          pnpm start > server.log 2>&1 &
          node dist/worker.js > worker.log 2>&1 &
          for i in $(seq 1 60); do curl -fs http://localhost:3000/login >/dev/null && break; sleep 2; done
          pnpm e2e
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-logs
          path: |
            server.log
            worker.log
            test-results/
